<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose a new password — Doc Scanner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-main">
    <h1>Doc Scanner</h1>
    <p class="subtitle">Choose a new password.</p>

    <form id="resetForm" class="auth-form">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required />

      <label for="confirmPassword">Repeat new password</label>
      <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required />
      <p class="muted">At least 8 characters.</p>

      <button id="saveBtn" type="submit">Save new password</button>
      <p id="error" class="error hidden"></p>
    </form>

    <div id="done" class="auth-form hidden">
      <p class="success">Your password has been changed.</p>
      <p>Any device that was logged in has been signed out. Log in with your new password.</p>
      <p><a href="login.html">Go to log in →</a></p>
    </div>

    <p class="guest-link hidden" id="requestAgain"><a href="forgot-password.html">Request a new reset link</a></p>
  </main>

  <script src="reset-password.js"></script>
</body>
</html>
