name: DocScanner
options:
  bundleIdPrefix: com.danipina
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  DocScanner:
    type: application
    platform: iOS
    sources:
      - DocScanner
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Doc Scanner
        # XcodeGen's generated Info.plist otherwise hard-codes "1.0", which ignores MARKETING_VERSION
        # and makes App Store Connect reject every build after the first release.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSContactsUsageDescription: "Doc Scanner can add the details from a business card you scan to your contacts."
        NSCameraUsageDescription: "Doc Scanner uses the camera to scan your documents."
        ITSAppUsesNonExemptEncryption: false
        # Lets "Open in…" / "Copy to Doc Scanner" appear for PDFs and images in Files, Mail, Safari, etc.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danipina.docscanner
        DEVELOPMENT_TEAM: RW46NLF44W
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
