<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Doc Scanner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>📄 Doc Scanner</h1>
    <div class="header-right">
      <a href="https://paypal.me/danipinaNew/5eur" target="_blank" rel="noopener" class="support-link" title="Buy me a coffee">☕ Buy me a coffee</a>
    </div>
  </header>

  <main class="app-main">
    <ul class="scan-list" id="scanList"></ul>
    <p class="empty-state hidden" id="emptyState">No scans yet.<br />Tap the + button to scan your first document.</p>
    <p class="storage-note">
      Scans are saved only in this browser — nothing is uploaded. Your browser may clear them if you
      don't visit for a few weeks, so download any PDF you want to keep.
      <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="support.html">Support</a>
    </p>
  </main>

  <button class="fab" id="newScanBtn" title="New scan">+</button>

  <script src="common.js"></script>
  <script src="local-store.js"></script>
  <script src="app.js"></script>
</body>
</html>
